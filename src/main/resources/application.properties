spring.application.name=Dailic

# H2 DB ?? ?? (in-memory DB)
#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:tcp://localhost/~/test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA ??
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create

# H2 ?? UI ???
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# OpenAI credentials stay in the runtime environment. Set the model explicitly.
openai.key=${OPENAI_API_KEY:}
openai.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:}
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:5000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:30000}
